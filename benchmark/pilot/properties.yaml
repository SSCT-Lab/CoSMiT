records:
  - property_id: CCP-031
    group_id: G11-variance
    split: development
    source:
      library: PyTorch
      version: 2.9.1
      commit: d38164a545b4a4e4e0cf73ce67173f70574890b6
      test_path: test/test_reductions.py
      test_name: test_var_unbiased
      evidence: [E-PT-CCP-031]
    target_evidence:
      library: TensorFlow
      version: 2.20.0
      evidence: [E-TF-CCP-031]
    property:
      preconditions:
        - x is a finite float32 CPU tensor
        - the reduced element count n is greater than one
      operation: [torch.var(x) with default correction]
      observation: scalar variance value
      oracle:
        type: approximate-sample-variance
        expression: sum((x - mean(x)) ** 2) / (n - 1)
        rtol: 0.0
        atol: 0.0000001
      environment: {device: CPU}
      provenance: [E-PT-CCP-031, E-TF-CCP-031, E-DYN-PILOT-001]
    valid_domain: [finite float32 reductions with n greater than one]
    excluded_domain: [singleton reductions, empty reductions, complex values, accelerator-specific numerics]
    unresolved_assumptions: [multi-axis dynamic-shape correction]
    primary_annotator: provisional-A
    independent_reviewer: null
    adjudication: pending

  - property_id: CCP-034
    group_id: G12-softmax
    split: development
    source:
      library: PyTorch
      version: 2.9.1
      commit: d38164a545b4a4e4e0cf73ce67173f70574890b6
      test_path: test/test_nn.py
      test_name: test_softmax_cpu
      evidence: [E-PT-CCP-034]
    target_evidence:
      library: TensorFlow
      version: 2.20.0
      evidence: [E-TF-CCP-034]
    property:
      preconditions:
        - x is a finite rank-2 float32 CPU tensor
        - source normalization dimension is zero
      operation: [torch.nn.functional.softmax(x, dim=0)]
      observation: complete probability tensor
      oracle:
        type: approximate-tensor-value
        reference: stable softmax normalized along source dimension zero
        rtol: 0.0
        atol: 0.0000001
      environment: {device: CPU}
      provenance: [E-PT-CCP-034, E-TF-CCP-034, E-DYN-PILOT-001]
    valid_domain: [finite rank-2 float32 tensors]
    excluded_domain: [empty axes, non-finite values, low-precision overflow, accelerator-specific kernels]
    unresolved_assumptions: [all supported ranks and sparse representations]
    primary_annotator: provisional-A
    independent_reviewer: null
    adjudication: pending

  - property_id: CCP-035
    group_id: G12-softmax
    split: development
    source:
      library: PyTorch
      version: 2.9.1
      commit: d38164a545b4a4e4e0cf73ce67173f70574890b6
      test_path: test/test_nn.py
      test_name: test_softmax_cpu
      evidence: [E-PT-CCP-035]
    target_evidence:
      library: TensorFlow
      version: 2.20.0
      evidence: [E-TF-CCP-035]
    property:
      preconditions:
        - x is a finite rank-2 float16 CPU tensor
        - source computation dtype is explicitly float32
      operation: [torch.nn.functional.softmax(x, dim=1, dtype=torch.float32)]
      observation: output dtype
      oracle: {type: dtype-equality, expected: float32}
      environment: {device: CPU}
      provenance: [E-PT-CCP-035, E-TF-CCP-035, E-DYN-PILOT-001]
    valid_domain: [finite rank-2 float16 inputs with explicit float32 computation dtype]
    excluded_domain: [value-equivalence as a separate oracle, accelerator-specific mixed precision]
    unresolved_assumptions: [automatic mixed-precision policies]
    primary_annotator: provisional-A
    independent_reviewer: null
    adjudication: pending
