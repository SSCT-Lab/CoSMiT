dataset: cosmit-candidate-certification-pilot
schema_version: 0.1
annotation_status: provisional-primary
environment_id: macos-arm64-py310-torch291-tf2200-cpu
evidence_ledger: ../feasibility/evidence.yaml
trace_bundle: ../feasibility/dynamic-trace.json

records:
  - property_id: CCP-001
    group_id: G01-reduction-sum
    split: development
    source: {test_path: test/test_reductions.py, test_name: test_sum_integer_upcast, evidence: [E-PT-001]}
    target_evidence: [E-TF-001]
    property:
      preconditions: [x is an int32 CPU tensor]
      operation: [torch.sum(x)]
      observation: output dtype
      oracle: {type: dtype-equality, expected: int64}
      environment: {device: CPU}
      provenance: [E-PT-001, E-TF-001, E-DYN-001]
    valid_domain: [int32 CPU tensors in the frozen environment]
    excluded_domain: [accelerator accumulation, complex inputs]
    unresolved_assumptions: [all integral input dtypes]
    primary_annotator: provisional-A

  - property_id: CCP-004
    group_id: G02-reduction-mean
    split: development
    source: {test_path: test/test_reductions.py, test_name: test_mean_int_with_optdtype, evidence: [E-PT-002]}
    target_evidence: [E-TF-002]
    property:
      preconditions: ["x equals the int64 tensor [1, 2]", requested source dtype is float32]
      operation: [torch.mean(x, dtype=torch.float32)]
      observation: scalar output value
      oracle: {type: exact-scalar, expected: 1.5}
      environment: {device: CPU}
      provenance: [E-PT-002, E-TF-002, E-DYN-001]
    valid_domain: [the fixed witness and finite int64 inputs exactly representable after float32 conversion]
    excluded_domain: [large integers requiring exact preservation, empty reductions]
    unresolved_assumptions: [float32 precision boundary]
    primary_annotator: provisional-A

  - property_id: CCP-007
    group_id: G03-argmax
    split: development
    source: {test_path: test/test_reductions.py, test_name: test_tensor_compare_ops_argmax_argmix_kthvalue_dim_empty, evidence: [E-PT-003]}
    target_evidence: [E-TF-003]
    property:
      preconditions: [x is a nonempty rank-2 float tensor, reduction dimension is one]
      operation: [torch.argmax(x, dim=1)]
      observation: output dtype
      oracle: {type: dtype-equality, expected: int64}
      environment: {device: CPU}
      provenance: [E-PT-003, E-TF-003, E-DYN-001]
    valid_domain: [nonempty rank-2 float CPU tensors reduced on dimension one]
    excluded_domain: [empty reduction dimensions, value and tie-policy oracles]
    unresolved_assumptions: []
    primary_annotator: provisional-A

  - property_id: CCP-010
    group_id: G04-transpose-permute
    split: development
    source: {test_path: test/test_view_ops.py, test_name: test_transpose_vs_numpy, evidence: [E-PT-004]}
    target_evidence: [E-TF-004]
    property:
      preconditions: ["x contains 24 ordered values with shape [2, 3, 4]", source dimensions are zero and one]
      operation: [torch.transpose(x, 0, 1)]
      observation: complete output tensor
      oracle: {type: exact-tensor-value, reference: swap only dimensions zero and one}
      environment: {device: CPU}
      provenance: [E-PT-004, E-TF-004, E-DYN-001]
    valid_domain: [rank-3 CPU tensors with valid distinct dimensions zero and one]
    excluded_domain: [view aliasing as a separate property, unknown rank]
    unresolved_assumptions: [negative dimensions]
    primary_annotator: provisional-A

  - property_id: CCP-013
    group_id: G05-squeeze
    split: development
    source: {test_path: test/test_torch.py, test_name: test_tensor_shape_empty plus one-factor counterfactual, evidence: [E-PT-005]}
    target_evidence: [E-TF-005]
    property:
      preconditions: ["x has shape [1, 3]", selected dimension one has size three]
      operation: [torch.squeeze(x, dim=1)]
      observation: complete output tensor
      oracle: {type: identity-tensor-relation, reference: input x}
      environment: {device: CPU}
      provenance: [E-PT-005, E-TF-005, E-DYN-001]
    valid_domain: [eager tensors with an observable nonunit selected dimension]
    excluded_domain: [symbolic unknown dimension size, unit selected dimensions]
    unresolved_assumptions: [symbolic condition support]
    primary_annotator: provisional-A

  - property_id: CCP-016
    group_id: G06-clamp-clip
    split: development
    source: {test_path: test/test_torch.py, test_name: test_clamp, evidence: [E-PT-006]}
    target_evidence: [E-TF-006]
    property:
      preconditions: ["x is the int32 tensor [-1, 0, 1000]", only lower bound zero is supplied]
      operation: [torch.clamp(x, min=0)]
      observation: complete output tensor
      oracle: {type: exact-tensor-value, expected: [0, 0, 1000]}
      environment: {device: CPU}
      provenance: [E-PT-006, E-TF-006, E-DYN-001]
    valid_domain: [ordered numeric int32 CPU tensors with a lower bound only]
    excluded_domain: [complex values, NaN policy, boundary gradients]
    unresolved_assumptions: [floating signed-zero semantics]
    primary_annotator: provisional-A

  - property_id: CCP-019
    group_id: G07-approximate-oracle
    split: development
    source: {test_path: test/test_testing.py, test_name: test_not_close, evidence: [E-PT-007]}
    target_evidence: [E-TF-007]
    property:
      preconditions: [actual is float32 zero, expected is float32 0.000005]
      operation: [torch.testing.assert_close(actual, expected, rtol=0, atol=0.00001)]
      observation: assertion outcome
      oracle: {type: assertion-outcome, expected: pass}
      environment: {device: CPU}
      provenance: [E-PT-007, E-TF-007, E-DYN-001]
    valid_domain: [float32 scalar pairs under explicit rtol zero and atol 0.00001]
    excluded_domain: [NaN equality, dtype and layout checks]
    unresolved_assumptions: [full tolerance-formula equivalence at all magnitudes]
    primary_annotator: provisional-A

  - property_id: CCP-022
    group_id: G08-cross-entropy
    split: development
    source: {test_path: test/test_nn.py, test_name: test_cross_entropy_loss_index_target_unit_weights, evidence: [E-PT-008]}
    target_evidence: [E-TF-008]
    property:
      preconditions: ["logits have shape [N, C, L]", "sparse labels have shape [N, L]", class dimension is one]
      operation: [torch.nn.functional.cross_entropy(logits, labels, reduction=mean)]
      observation: scalar mean loss
      oracle: {type: approximate-scalar-value, relation: absolute source-target difference at most 0.0000001}
      environment: {device: CPU}
      provenance: [E-PT-008, E-TF-008, E-DYN-001]
    valid_domain: [finite float32 logits, valid int64 labels, unweighted mean reduction]
    excluded_domain: [class weights, ignore_index, label smoothing, invalid labels]
    unresolved_assumptions: [weighted reduction denominator]
    primary_annotator: provisional-A

  - property_id: CCP-025
    group_id: G09-random-normal
    split: development
    source: {test_path: test/test_torch.py, test_name: test_generator_cpu, evidence: [E-PT-009]}
    target_evidence: [E-TF-009]
    property:
      preconditions: ["two fresh CPU generators use seed 123 and sample shape [5]"]
      operation: [draw one normal sample from each generator]
      observation: pair of generated tensors within one implementation
      oracle: {type: within-implementation-replay, expected: exact equality between the pair}
      environment: {device: CPU, seed: 123}
      provenance: [E-PT-009, E-TF-009, E-DYN-001]
    valid_domain: [fresh same-version CPU generators reset to the same seed]
    excluded_domain: [exact cross-library sample equality, cross-version and cross-device sequences]
    unresolved_assumptions: [long-sequence state consumption, distribution equivalence]
    primary_annotator: provisional-A

  - property_id: CCP-028
    group_id: G10-automatic-gradient
    split: development
    source: {test_path: test/test_autograd.py, test_name: test_grad_materialize_grads, evidence: [E-PT-010]}
    target_evidence: [E-TF-010]
    property:
      preconditions: [x is watched but the scalar output is disconnected from x]
      operation: [torch.autograd.grad with allow_unused and materialize_grads]
      observation: gradient with respect to x
      oracle: {type: exact-scalar, expected: 0.0}
      environment: {device: CPU}
      provenance: [E-PT-010, E-TF-010, E-DYN-001]
    valid_domain: [unconnected differentiable scalar or tensor CPU inputs]
    excluded_domain: [higher-order retention, custom-gradient side effects]
    unresolved_assumptions: [higher-order graph materialization]
    primary_annotator: provisional-A
