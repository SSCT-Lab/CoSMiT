decision_rule:
  distinguishable: The two generated TDLs explicitly retain the changed clause with the correct value in machine-auditable text.
  collision: The TDLs omit, conflate, or incorrectly state the changed clause so that the required target adapters cannot be distinguished.
  invalid_output: Either output is unparsable or contradicts the source test.
  undetermined: Human reviewers cannot determine clause retention from the TDL alone.
