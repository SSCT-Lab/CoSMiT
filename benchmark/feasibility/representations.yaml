dataset: cosmit-feasibility
schema_version: 0.1
status: feasibility-proxy-not-baseline-result

method_notes:
  tdl_style: Manually normalized TDL-style proxy; the official IntentTester extraction pipeline was not executed.
  unrestricted_llm_summary: One-pass research summary produced during pilot construction; not blinded or replicated.
  tdl_plus_ast_facts: Proxy containing call names, literal arguments, input shapes/dtypes and assertion syntax, but not inferred API contracts.
  property_ir_gold: Provisional Property IR derived from official tests and dynamic probes; independent reviewer pending.
  interpretation: Results may select motivating cases and refine the schema, but must not be reported as an IntentTester effectiveness comparison.

records:
  - property_id: PTF-001
    transport_critical_clauses: [integer sum output is int64]
    tdl_style:
      text: Sum an int32 tensor and verify the numerical result.
      preserved: []
      missing: [integer sum output is int64]
    unrestricted_llm_summary:
      text: Test that summing an integer tensor returns the expected value.
      preserved: []
      missing: [integer sum output is int64]
    tdl_plus_ast_facts:
      text: input dtype=int32; call=torch.sum(x); assertion checks result using framework equality.
      preserved: []
      missing: [implicit integer-to-int64 promotion]
    property_ir_gold:
      preserved: [integer sum output is int64]
      missing: []

  - property_id: PTF-002
    transport_critical_clauses: [integer input must be cast before target mean, output dtype is float32]
    tdl_style:
      text: Compute the mean of an integer tensor using float32 output and compare the result.
      preserved: [integer input must be cast before target mean, output dtype is float32]
      missing: []
    unrestricted_llm_summary:
      text: Test the mean of an integer tensor.
      preserved: []
      missing: [integer input must be cast before target mean, output dtype is float32]
    tdl_plus_ast_facts:
      text: input dtype=int64; call=torch.mean(x,dtype=float32); expected value=1.5.
      preserved: [integer input must be cast before target mean, output dtype is float32]
      missing: []
    property_ir_gold:
      preserved: [integer input must be cast before target mean, output dtype is float32]
      missing: []

  - property_id: PTF-003
    transport_critical_clauses: [output index dtype is int64, ties select the first index]
    tdl_style:
      text: Find the maximum index along axis 1 and compare the expected indices.
      preserved: []
      missing: [output index dtype is int64, ties select the first index]
    unrestricted_llm_summary:
      text: Test argmax along an axis.
      preserved: []
      missing: [output index dtype is int64, ties select the first index]
    tdl_plus_ast_facts:
      text: input contains tied maxima; call=torch.argmax(x,dim=1); expected indices=[1,0].
      preserved: [ties select the first index]
      missing: [implicit output index dtype is int64]
    property_ir_gold:
      preserved: [output index dtype is int64, ties select the first index]
      missing: []

