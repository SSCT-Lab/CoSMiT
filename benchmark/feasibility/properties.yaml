  - property_id: PTF-004
    group_id: transpose-permute
    parent_test_id: pytorch-test_transpose_vs_numpy
    source:
      library: PyTorch
      version: 2.9.1
      commit: d38164a545b4a4e4e0cf73ce67173f70574890b6
      test_path: test/test_view_ops.py
      test_name: test_transpose_vs_numpy
      evidence: [E-PT-004]
    target:
      library: TensorFlow
      version: 2.20.0
      candidate_api_or_composition: tf.transpose(x, perm=swap(identity_perm(rank(x)), 0, 1))
      evidence: [E-TF-004]
    property:
      preconditions:
        - "x has static shape [2, 3, 4]"
        - source dimensions are 0 and 1
      operation: ["torch.transpose(x, 0, 1)"]
      observation: complete output shape and values
      oracle: {type: exact-tensor-equality, expected_shape: [3, 2, 4]}
      environment: {device: CPU}
      provenance: [E-PT-004, E-TF-004, E-DYN-001]
    gold_adapter:
      input: [identity]
      operation: [construct a full target permutation by swapping source dims 0 and 1]
      observation: [complete tensor]
      oracle: [exact tensor equality]
      environment: [CPU]
    valid_domain: [static rank-3 tensors with valid distinct dimensions]
    excluded_domain: [unknown rank, invalid dimensions, aliasing/view identity requirements]
    semantic_relation: adapted-transport
    evidence_state: bounded-supported
    gold_counterexamples: [dynamic-trace.json#PTF-004 omitted target perm reverses every dimension]
    unresolved_assumptions: [transport of PyTorch view aliasing semantics]
    annotator: provisional-A
    reviewer: null
    adjudication: pending-independent-review

