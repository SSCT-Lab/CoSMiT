records:
  - property_id: PTF-001
    group_id: reduction-sum
    parent_test_id: pytorch-test_sum_integer_upcast
    source:
      library: PyTorch
      version: 2.9.1
      commit: d38164a545b4a4e4e0cf73ce67173f70574890b6
      test_path: test/test_reductions.py
      test_name: test_sum_integer_upcast
      evidence: [E-PT-001]
    target:
      library: TensorFlow
      version: 2.20.0
      candidate_api_or_composition: tf.reduce_sum(tf.cast(x, tf.int64))
      evidence: [E-TF-001]
    property:
      preconditions: [x is an int32 CPU tensor]
      operation: [torch.sum(x)]
      observation: output dtype
      oracle: {type: dtype-equality, expected: int64}
      environment: {device: CPU}
      provenance: [E-PT-001, E-TF-001, E-DYN-001]
    gold_adapter:
      input: [cast int32 input to target int64]
      operation: [map torch.sum to tf.reduce_sum]
      observation: [observe output dtype]
      oracle: [require int64]
      environment: [CPU]
    valid_domain: [bounded to int32 tensors in the frozen environment]
    excluded_domain: [overflow equivalence, accelerator-specific accumulation, complex inputs]
    semantic_relation: adapted-transport
    evidence_state: bounded-supported
    gold_counterexamples: [dynamic-trace.json#PTF-001 direct tf.reduce_sum preserves value but returns int32]
    unresolved_assumptions: [generalization to every integral dtype]
    annotator: provisional-A
    reviewer: null
    adjudication: pending-independent-review

  - property_id: PTF-002
