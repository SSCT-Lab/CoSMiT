  - property_id: PTF-008
    group_id: cross-entropy
    parent_test_id: pytorch-test_cross_entropy_loss_index_target_unit_weights
    source:
      library: PyTorch
      version: 2.9.1
      commit: d38164a545b4a4e4e0cf73ce67173f70574890b6
      test_path: test/test_nn.py
      test_name: test_cross_entropy_loss_index_target_unit_weights
      evidence: [E-PT-008]
    target:
      library: TensorFlow
      version: 2.20.0
      candidate_api_or_composition: transpose class axis to last, sparse_softmax_cross_entropy_with_logits, reduce_mean
      evidence: [E-TF-008]
    property:
      preconditions:
        - "logits shape [N, C, L]"
        - "sparse labels shape [N, L]"
        - class axis is 1
      operation: ["torch.nn.functional.cross_entropy(logits, labels, reduction=mean)"]
      observation: scalar loss
      oracle: {type: approximate-value, rtol: 0.0, atol: 0.0000001}
      environment: {device: CPU}
      provenance: [E-PT-008, E-TF-008, E-DYN-001]
    gold_adapter:
      input: ["transpose logits from [N, C, L] to [N, L, C]"]
      operation: [tf.nn.sparse_softmax_cross_entropy_with_logits then tf.reduce_mean]
      observation: [scalar reduced loss]
      oracle: [absolute difference at most 1e-7]
      environment: [CPU]
    valid_domain: [finite float32 logits, valid int64 class labels, unweighted mean reduction]
    excluded_domain: [class weights, ignore_index, label smoothing, invalid labels]
    semantic_relation: adapted-transport
    evidence_state: bounded-supported
    gold_counterexamples: [dynamic-trace.json#PTF-008 direct target call either fails on shape or executes with a 1.0724 loss error when dimensions coincide]
    unresolved_assumptions: [weighted mean denominator and ignored-label semantics]
    annotator: provisional-A
    reviewer: null
    adjudication: pending-independent-review

  - property_id: PTF-009
